spring.application.name=merchant-policy-service
spring.data.mongodb.uri=mongodb://${MERCHANT_POLICY_DB_HOST:localhost}:${MERCHANT_POLICY_DB_PORT:27017}/${MERCHANT_POLICY_DB_NAME:ec_merchant}${MONGO_URI_PARAMS:?replicaSet=rs0&directConnection=true}
spring.data.mongodb.auto-index-creation=true

# gRPC server
grpc.server.port=9107

# gRPC client -> merchant service
grpc.client.merchant.host=${MERCHANT_SERVICE_HOST:localhost}
grpc.client.merchant.port=${MERCHANT_SERVICE_PORT:9103}

