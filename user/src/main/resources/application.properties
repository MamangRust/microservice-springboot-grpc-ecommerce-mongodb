spring.application.name=user-service
spring.data.mongodb.uri=mongodb://${USER_DB_HOST:localhost}:${USER_DB_PORT:27017}/${USER_DB_NAME:ec_identity}${MONGO_URI_PARAMS:?replicaSet=rs0&directConnection=true}
spring.data.mongodb.auto-index-creation=true

# gRPC server
grpc.server.port=9102

# gRPC client -> role service
grpc.client.role.host=${ROLE_GRPC_HOST:localhost}
grpc.client.role.port=${ROLE_GRPC_PORT:9101}

