name: ecommerce-local

services:
  # Satu instance MongoDB; tiap bounded context memakai database terpisah di
  # instance yang sama. Service connect via <MODULE>_DB_HOST/_PORT/_NAME.
  mongo:
    image: mongo:7
    container_name: ecommerce-mongo
    # Single-node replica set (rs0): multi-document transactions dibutuhkan agar
    # business write + outbox insert bisa atomik. Client konek dengan
    # ?replicaSet=rs0&directConnection=true (lihat application.properties).
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ec_identity
    volumes:
      - mongo_ecommerce_data:/data/db
    networks:
      - app_ecommerce_network
    healthcheck:
      # rs.status() hanya berhasil setelah replica set diinisialisasi ->
      # service lain baru start setelah DB siap dipakai transaksi.
      test: ["CMD", "mongosh", "--quiet", "--eval", "rs.status().ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Inisialisasi replica set sekali saja (idempotent).
  mongo-init:
    image: mongo:7
    container_name: ecommerce-mongo-init
    restart: "no"
    networks:
      - app_ecommerce_network
    depends_on:
      mongo:
        condition: service_started
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        until mongosh --host mongo:27017 --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do sleep 2; done;
        mongosh --host mongo:27017 --quiet --eval
        "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) }"

  apigateway:
    image: apigateway-ecommerce-service:1.0
    container_name: apigateway-ecommerce
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ./logs:/var/log/app
      - ./uploads:/app/uploads
    ports:
      - "5000:5000"
    networks:
      - app_ecommerce_network
    depends_on:
      kafka:
        condition: service_healthy
      auth:
        condition: service_started
      role:
        condition: service_started
      user:
        condition: service_started
      category:
        condition: service_started
      merchant:
        condition: service_started
      order-item:
        condition: service_started
      order:
        condition: service_started
      product:
        condition: service_started
      transaction:
        condition: service_started
      cart:
        condition: service_started
      review:
        condition: service_started
      slider:
        condition: service_started
      shipping_address:
        condition: service_started
      banner:
        condition: service_started
      merchant_award:
        condition: service_started
      merchant_business:
        condition: service_started
      merchant_detail:
        condition: service_started
      merchant_policy:
        condition: service_started
      review_detail:
        condition: service_started
      stats_reader:
        condition: service_started
    environment:
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - GRPC_STATS_READER_ADDR=stats_reader:9121
      - GRPC_CLIENT_STATS_HOST=stats_reader
      - GRPC_CLIENT_STATS_PORT=9121

