apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: ecommerce
  labels:
    app: migrate
spec:
  template:
    metadata:
      labels:
        app: migrate
    spec:
      # Satu bounded context = satu MongoDB: tunggu keenam instance siap sebelum
      # menjalankan migrasi. Mongock menarget DB-nya sendiri (DB_MIGRATE_*) saat
      # startup, jadi cukup pastikan semua instance MongoDB menerima koneksi.
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for the six MongoDB instances..."
              until nc -z mongo-identity.ecommerce.svc.cluster.local 27017 \
                && nc -z mongo-merchant.ecommerce.svc.cluster.local 27017 \
                && nc -z mongo-catalog.ecommerce.svc.cluster.local 27017 \
                && nc -z mongo-sales.ecommerce.svc.cluster.local 27017 \
                && nc -z mongo-experience.ecommerce.svc.cluster.local 27017 \
                && nc -z mongo-email.ecommerce.svc.cluster.local 27017; do
                echo "MongoDB not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] All MongoDB instances are ready!"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: migrate
          image: ghcr.io/__GHCR_OWNER__/springboot-ecommerce/db-migration:latest
          workingDir: /app
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          imagePullPolicy: IfNotPresent
      restartPolicy: OnFailure
