apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-address
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shipping-address
  template:
    metadata:
      labels:
        app: shipping-address
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for MongoDB to be ready (TCP)..."
              until nc -z mongo-experience.ecommerce.svc.cluster.local 27017; do
                echo "MongoDB is not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] MongoDB is accessible!"
      containers:
        - name: shipping-address
          image: ghcr.io/__GHCR_OWNER__/springboot-ecommerce/shipping_address:latest
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          ports:
            - containerPort: 8093
            - name: grpc
              containerPort: 9118
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          livenessProbe:
            tcpSocket:
              port: 9118
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 9118
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: 9118
            failureThreshold: 30
            periodSeconds: 10
          imagePullPolicy: IfNotPresent
