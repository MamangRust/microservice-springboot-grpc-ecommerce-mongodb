apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "[INIT] Waiting for MongoDB to be ready (TCP)..."
              until nc -z mongo-identity.ecommerce.svc.cluster.local 27017; do
                echo "MongoDB is not ready yet. Retrying in 5 seconds..."
                sleep 5
              done
              echo "[INIT] MongoDB is accessible!"
        - name: wait-for-kafka
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "Waiting for Kafka to be ready (TCP)..."
              until nc -z kafka.ecommerce.svc.cluster.local 9092; do
                echo "Kafka is not ready yet. Waiting 5 seconds..."
                sleep 5
              done
              echo "Kafka is ready!"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: auth
          image: ghcr.io/__GHCR_OWNER__/springboot-ecommerce/auth:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          ports:
            - name: grpc
              containerPort: 9120
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 9120
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 9120
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: 9120
            failureThreshold: 30
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
