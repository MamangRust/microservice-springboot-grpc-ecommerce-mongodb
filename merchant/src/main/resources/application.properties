spring.application.name=merchant-service
spring.data.mongodb.uri=mongodb://${MERCHANT_DB_HOST:localhost}:${MERCHANT_DB_PORT:27017}/${MERCHANT_DB_NAME:ec_merchant}${MONGO_URI_PARAMS:?replicaSet=rs0&directConnection=true}
spring.data.mongodb.auto-index-creation=true

# gRPC server
grpc.server.port=9103

# gRPC client -> user service
grpc.client.user.host=${USER_SERVICE_HOST:localhost}
grpc.client.user.port=${USER_SERVICE_PORT:9102}

# JWT
springjwt.app.jwtSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c31
springjwt.app.jwtRefreshSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c32
springjwt.app.jwtExpirationMs=86400000
springjwt.app.jwtRefreshExpirationMs=86400000

# --- Transactional outbox (relay -> Kafka) ---------------------------------
# Relay memakai lease + claim token: dua replica service ini tidak akan
# mem-publish event yang sama. Event ditulis dalam transaksi MongoDB yang sama
# dengan business row, jadi event ada jika dan hanya jika row-nya ada.
outbox.publish.interval-ms=1000
merchant.outbox.batch-size=50
merchant.outbox.lease.seconds=300
merchant.outbox.retry-delay-seconds=30
merchant.outbox.max-attempts=5
