spring.application.name=stats-backfill
spring.main.web-application-type=none

# ---- Source MongoDB (transaction context) ----
spring.data.mongodb.uri=mongodb://${TRANSACTION_DB_HOST:localhost}:${TRANSACTION_DB_PORT:27017}/${TRANSACTION_DB_NAME:ec_sales}${MONGO_URI_PARAMS:?replicaSet=rs0&directConnection=true}

# ---- ClickHouse (target) ----
clickhouse.url=jdbc:clickhouse://${CLICKHOUSE_HOST:localhost}:${CLICKHOUSE_PORT:8123}/${CLICKHOUSE_DB:default}
clickhouse.username=${CLICKHOUSE_USER:default}
clickhouse.password=${CLICKHOUSE_PASSWORD:}
